[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["apps"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*",
    "apps/*/apps.py",
    "apps/*/__init__.py",
    "apps/*/admin.py",
    "apps/*/choices.py",
]
