openapi: 3.0.3
info:
  title: FairBet Lab API
  version: "1.0.0"
  description: API principal para autenticacion, usuarios, wallet, betting y auditoria.
servers:
  - url: http://localhost:8000
paths:
  /api/token/:
    post:
      summary: Obtener token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Tokens emitidos
  /api/auth/register/:
    post:
      summary: Registrar usuario
      responses:
        "201": { description: Usuario creado }
  /api/auth/me/:
    get:
      summary: Perfil autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Datos de usuario }
  /api/auth/limits/:
    post:
      summary: Actualizar limites de deposito
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Limites actualizados }
  /api/auth/self-exclusion/:
    post:
      summary: Registrar autoexclusion
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Autoexclusion registrada }
  /api/auth/verify-account/:
    post:
      summary: Verificar cuenta manualmente (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
      responses:
        "200": { description: Cuenta verificada }
        "403": { description: Solo admin }
  /api/wallet/deposit/:
    post:
      summary: Depositar fichas virtuales
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Deposito aplicado }
  /api/wallet/balance/:
    get:
      summary: Consultar saldo wallet
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Saldo actual }
  /api/betting/bets/:
    post:
      summary: Crear apuesta
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Apuesta aceptada }
  /api/betting/events/{event_id}/settle/:
    post:
      summary: Liquidar apuestas del evento (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Evento liquidado }
  /api/audit/verify/:
    get:
      summary: Verificar integridad de la cadena de auditoria (admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Resultado de integridad }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

