{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-2xl border border-[var(--slate-200)] bg-white p-8 shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--slate-500)]">Registro seguro</p>
    <h1 class="mt-2 text-3xl font-extrabold text-[var(--slate-900)]">Crear cuenta</h1>
    <p class="mt-2 text-sm text-[var(--slate-500)]">Completa tus datos para habilitar el acceso.</p>

    {% if errors %}
      <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
        {{ errors }}
      </div>
    {% endif %}

    <form method="post" class="mt-6 grid gap-4 md:grid-cols-2">
      {% csrf_token %}
      <div class="md:col-span-2">
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="register-email">Email</label>
        <input id="register-email" name="email" type="email" placeholder="correo@ejemplo.com" value="{{ form.email }}" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="register-dni">DNI</label>
        <input id="register-dni" name="dni" placeholder="DNI" value="{{ form.dni }}" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="register-birth">Fecha de nacimiento</label>
        <input id="register-birth" name="birth_date" type="date" value="{{ form.birth_date }}" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="register-first">Nombre</label>
        <input id="register-first" name="first_name" placeholder="Nombre" value="{{ form.first_name }}" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="register-last">Apellido</label>
        <input id="register-last" name="last_name" placeholder="Apellido" value="{{ form.last_name }}" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div class="md:col-span-2">
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="register-password">Password</label>
        <input id="register-password" name="password" type="password" placeholder="••••••••" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div class="md:col-span-2">
        <button class="w-full rounded-full bg-[var(--brand-600)] px-4 py-3 text-sm font-semibold text-white hover:bg-[var(--brand-700)]">Registrarme</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
