{% extends "base.html" %}
{% block content %}
<section class="max-w-xl">
  <h1 class="mb-4 text-2xl font-semibold">Registro</h1>
  {% if errors %}<pre class="mb-4 rounded bg-red-50 p-3 text-sm text-red-700">{{ errors }}</pre>{% endif %}
  <form id="register-form" method="post" class="grid gap-4 rounded border bg-white p-5 md:grid-cols-2">
    {% csrf_token %}
    <input name="email" type="email" placeholder="Email" value="{{ form.email }}" class="rounded border px-3 py-2" required>
    <input id="dni-base" name="dni_base" placeholder="DNI (8 dígitos)" value="{{ form.dni }}" maxlength="8" pattern="\d{8}" title="Ingrese 8 dígitos" class="rounded border px-3 py-2" required>
    <input id="dni-full" type="hidden" name="dni" value="">
    <input name="first_name" placeholder="Nombre" value="{{ form.first_name }}" class="rounded border px-3 py-2" required>
    <input name="last_name" placeholder="Apellido" value="{{ form.last_name }}" class="rounded border px-3 py-2" required>
    <input name="birth_date" type="date" value="{{ form.birth_date }}" class="rounded border px-3 py-2" required>
    <input name="password" type="password" placeholder="Password" class="rounded border px-3 py-2" required>
    <button class="rounded bg-emerald-700 px-4 py-2 text-white md:col-span-2">Registrarme</button>
  </form>
  <script>
  (function(){
    function calcularDV(ocho) {
      const pesos = [3,2,7,6,5,4,3,2];
      let suma = 0;
      for (let i = 0; i < 8; i++) suma += parseInt(ocho[i], 10) * pesos[i];
      let resultado = 11 - (suma % 11);
      if (resultado === 11) resultado = 0;
      const tablaNum = '67890112345';
      return tablaNum[resultado];
    }

    const form = document.getElementById('register-form');
    const dniBase = document.getElementById('dni-base');
    const dniFull = document.getElementById('dni-full');

    form.addEventListener('submit', function(e){
      const val = dniBase.value.replace(/\D/g,'');
      if (val.length !== 8) {
        e.preventDefault();
        alert('Ingrese los 8 dígitos del DNI.');
        dniBase.focus();
        return false;
      }
      const dv = calcularDV(val);
      dniFull.value = val + dv;
      return true;
    });
  })();
  </script>
</section>
{% endblock %}
