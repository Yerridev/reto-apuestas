{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-2xl border border-[var(--slate-200)] bg-white p-8 shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--slate-500)]">Acceso seguro</p>
    <h1 class="mt-2 text-3xl font-extrabold text-[var(--slate-900)]">Ingresar</h1>
    <p class="mt-2 text-sm text-[var(--slate-500)]">Inicia sesion para acceder a tus apuestas y wallet.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="login-email">Email</label>
        <input id="login-email" name="email" type="email" placeholder="correo@ejemplo.com" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <div>
        <label class="text-sm font-semibold text-[var(--slate-900)]" for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="••••••••" class="mt-2 w-full rounded-xl border border-[var(--slate-200)] px-4 py-3 text-sm font-semibold text-[var(--slate-900)] focus:border-[var(--brand-600)] focus:outline-none" required>
      </div>
      <button class="w-full rounded-full bg-[var(--brand-600)] px-4 py-3 text-sm font-semibold text-white hover:bg-[var(--brand-700)]">Entrar</button>
      <p class="text-center text-sm text-[var(--slate-500)]">
        No tenes cuenta? <a href="{% url 'web-register' %}" class="font-semibold text-[var(--brand-600)]">Crear cuenta</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
